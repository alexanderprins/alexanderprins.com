<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Job Watch | Alexander Prins</title>
<link rel="icon" href="/favicon_light.svg" type="image/svg+xml">
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/nsl4rke.css">
<style>
/* Private, unlisted page. Data comes from a secret gist that job-hunt/watch/run.sh
   updates every morning at 7am, so the page itself never needs a redeploy.
   Style matches alexanderprins.com (see /resumes). */
:root {
  --bg: #fbfbfb;
  --ink: #1e1e1e;
  --ink-60: rgb(30 30 30 / 0.6);
  --line: rgb(30 30 30 / 0.15);
  --font: "aktiv-grotesk", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 24px; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
p { text-wrap: pretty; margin: 0; }
h1, h2, h3 { text-wrap: balance; font-weight: 400; margin: 0; }
.page { max-width: 1440px; margin: 0 auto; padding-block: 48px 144px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.top a { text-decoration: none; }
.top a:hover { text-decoration: underline; }
.muted { color: var(--ink-60); }
.intro { margin-top: 120px; display: grid; gap: 16px; max-width: 720px; }
.intro h1 { font-size: clamp(28px, 3.4vw, 40px); line-height: 1.15; letter-spacing: -0.01em; }
.day { margin-top: 120px; }
.head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; border-top: 1px solid var(--line); padding-top: 24px; margin-bottom: 24px; }
.head h2 { font-size: 16px; line-height: 24px; }
.job { display: grid; grid-template-columns: 72px minmax(0, 4fr) minmax(0, 5fr) 240px; column-gap: 24px; row-gap: 12px; padding-block: 24px; border-bottom: 1px solid var(--line); align-items: start; }
.score { font-size: 32px; line-height: 32px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.who { display: grid; gap: 8px; min-width: 0; }
.who h3 { font-size: 16px; line-height: 24px; }
.note { font-size: 14px; line-height: 21px; color: var(--ink-60); }
.links { display: flex; justify-content: flex-end; gap: 16px; white-space: nowrap; font-size: 14px; line-height: 24px; }
.links a { text-decoration: none; }
.links a:hover, .links a:focus-visible { text-decoration: underline; }
.links .none { color: var(--ink-60); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tag { display: inline-block; border: 1px solid var(--line); padding: 1px 10px; font-size: 14px; line-height: 20px; color: var(--ink-60); }
.tag.dark { color: var(--ink); border-color: rgb(30 30 30 / 0.4); }
.sub { margin-top: 48px; margin-bottom: 8px; font-size: 14px; line-height: 21px; color: var(--ink-60); }
.empty { padding-block: 24px; border-bottom: 1px solid var(--line); color: var(--ink-60); }
.skipped { margin-top: 144px; }
.sk { display: grid; grid-template-columns: 72px minmax(0, 3fr) minmax(0, 4fr) 240px; column-gap: 24px; padding-block: 10px; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 21px; }
.sk .links { font-size: 14px; line-height: 21px; }
.status { margin-top: 120px; color: var(--ink-60); }
@media (max-width: 900px) {
  .job { grid-template-columns: 56px minmax(0, 1fr); }
  .job .note, .job .links { grid-column: 2; }
  .score { font-size: 24px; line-height: 24px; }
  .sk { grid-template-columns: 56px minmax(0, 1fr); row-gap: 4px; }
  .sk .why, .sk .links { grid-column: 2; }
  .links { justify-content: flex-start; }
}
@media (max-width: 640px) {
  .intro { margin-top: 72px; }
  .day, .status { margin-top: 96px; }
  .skipped { margin-top: 120px; }
}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <a href="/">Alexander Prins</a>
    <span class="muted">Job Watch</span>
  </div>
  <section class="intro">
    <h1>Job Watch</h1>
    <p class="muted">New brand and motion roles from LinkedIn and company job boards, ranked against my rubric. Checked every morning at 7am. Refresh for the newest list.</p>
    <p class="muted" id="meta"></p>
  </section>
  <main id="days"><p class="status">Loading…</p></main>
  <section class="skipped" id="skipped" hidden>
    <div class="head"><h2>Skipped</h2><span class="muted" id="sk-count"></span></div>
    <div id="sk-list"></div>
  </section>
</div>
<script>
const FEED = "https://gist.githubusercontent.com/alexanderprins/36de4812f044622ba2222e8757397163/raw/feed.json";
const src = new URLSearchParams(location.search).get("src") || FEED;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const day = d => new Date(d + "T12:00:00");
const long = d => day(d).toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
const short = d => d ? day(d).toLocaleDateString("en-US", { month: "short", day: "numeric" }) : "";
const ATS = { ashbyhq: "Ashby", greenhouse: "Greenhouse", lever: "Lever", workable: "Workable", myworkdayjobs: "Workday", smartrecruiters: "SmartRecruiters", jobvite: "Jobvite", bamboohr: "BambooHR", icims: "iCIMS" };
const host = u => { try { const h = new URL(u).hostname; const k = Object.keys(ATS).find(k => h.includes(k)); return k ? ATS[k] : "company site"; } catch { return "company site"; } };

function links(j) {
  const a = [];
  if (j.apply) a.push(`<a href="${esc(j.apply)}" target="_blank" rel="noopener">Apply on ${esc(host(j.apply))} ↗</a>`);
  if (j.linkedin) a.push(`<a href="${esc(j.linkedin)}" target="_blank" rel="noopener">LinkedIn ↗</a>`);
  return `<div class="links">${a.join("") || '<span class="none">No link</span>'}</div>`;
}

function tags(j, isNew, extra = []) {
  const t = [];
  if (isNew) t.push('<span class="tag dark">New</span>');
  if (j.source === "board") t.push('<span class="tag dark">Not on LinkedIn</span>');
  t.push(...extra.filter(Boolean).map(x => `<span class="tag">${esc(x)}</span>`));
  if (j.posted) t.push(`<span class="tag">Posted ${esc(short(j.posted))}</span>`);
  return `<div class="row">${t.join("")}</div>`;
}

function job(j, isNew, notable) {
  return `<article class="job">
    <div class="score">${notable ? "" : esc(j.score)}</div>
    <div class="who"><h3>${esc(j.company)}, ${esc(j.role)}</h3>${tags(j, isNew, [j.comp, notable ? j.where : j.location])}</div>
    <p class="note">${esc(j.note)}</p>
    ${links(j)}
  </article>`;
}

function render(feed) {
  let last = null;
  try { last = localStorage.getItem("jw-last-day"); } catch {}
  const days = feed.days || [];
  const newest = days[0]?.date;
  const updated = feed.updated ? new Date(feed.updated).toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
  document.getElementById("meta").textContent =
    `Last run ${updated}. ${feed.boards ? feed.boards + " company job boards watched." : ""}`;

  document.getElementById("days").innerHTML = days.map(d => {
    const isNew = last !== null && d.date > last;
    const picks = d.picks.length
      ? d.picks.map(j => job(j, isNew)).join("")
      : '<p class="empty">Nothing scored 55 or more.</p>';
    const notable = d.notable.length
      ? `<p class="sub">In office, but notable</p>${d.notable.map(j => job(j, isNew, true)).join("")}` : "";
    return `<section class="day">
      <div class="head"><h2>${esc(long(d.date))}</h2><span class="muted">${d.picks.length} worth a look · ${d.checked} new posts checked</span></div>
      ${picks}${notable}
    </section>`;
  }).join("") || '<p class="status">No runs yet.</p>';

  const sk = days.flatMap(d => d.skipped.map(s => ({ ...s, day: d.date })));
  if (sk.length) {
    document.getElementById("skipped").hidden = false;
    document.getElementById("sk-count").textContent = `${sk.length} roles, newest first`;
    document.getElementById("sk-list").innerHTML = sk.map(s => `<div class="sk">
      <span class="muted">${esc(short(s.day))}</span>
      <span>${esc(s.company)}, ${esc(s.role)}</span>
      <span class="why muted">${esc(s.reason)}</span>
      ${links(s)}
    </div>`).join("");
  }
  try { if (newest) localStorage.setItem("jw-last-day", newest); } catch {}
}

fetch(src + (src.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(e => { document.getElementById("days").innerHTML = `<p class="status">Could not load the feed (${esc(e.message)}). Try again in a minute.</p>`; });
</script>
</body>
</html>
